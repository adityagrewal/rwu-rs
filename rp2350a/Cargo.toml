[package]
edition = "2024"
name = "Pico-2W"
version = "0.1.0"
license = "MIT OR Apache-2.0"

publish = false

[dependencies]
embassy-executor = { version = "0.10.0", features = ["defmt", "platform-cortex-m", "executor-thread"] }
embassy-rp       = { version = "0.10.0", features = ["defmt", "rp235xa", "binary-info", "time-driver", "critical-section-impl"] }
embassy-time     = { version = "0.5.1", features = ["defmt"] }
defmt            = "1.0.1"
